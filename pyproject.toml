[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consent-vision-ops"
version = "0.1.0"
description = "Production-ready consent-based computer vision and access-operations platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Platform Team" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "asyncpg>=0.29; platform_system != 'Windows'",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "cryptography>=42.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "websockets>=12.0",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
cv = [
  "ultralytics>=8.2",
  "insightface>=0.7.3",
  "mediapipe; platform_system != 'Windows'",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
cvo-api = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"